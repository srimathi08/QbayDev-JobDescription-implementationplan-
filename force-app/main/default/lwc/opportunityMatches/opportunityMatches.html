<template>
    <div class="qb-panel matches">
        <div class="head">
            <div>
                <div class="qb-title">Best-fit candidates</div>
                <div class="qb-sub">Scored 0-100 on skills, experience, role, certifications and location. AI checks the top 10.</div>
            </div>
            <div class="head-actions">
                <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" title="Refresh" onclick={handleRefresh}></lightning-button-icon>
                <lightning-button label="Re-score" icon-name="utility:magicwand" onclick={handleRescore} disabled={busy}></lightning-button>
            </div>
        </div>

        <div class="bar-row">
            <div class="qb-segment" aria-label="Minimum score">
                <template for:each={filterButtons} for:item="f">
                    <button key={f.key} class={f.cls} data-value={f.value} onclick={handleFilter}>{f.text}</button>
                </template>
            </div>
            <template lwc:if={statusText}><span class="qb-muted">{statusText}</span></template>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative spinner-box"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
        </template>
        <template lwc:if={errorMessage}>
            <div class="qb-empty error">{errorMessage}</div>
        </template>
        <template lwc:if={noRows}>
            <div class="qb-empty">{emptyText}</div>
        </template>

        <template lwc:if={hasRows}>
            <ul class="list">
                <template for:each={pageRows} for:item="r">
                    <li key={r.id} class="item">
                        <div class="row">
                            <span class="rank">{r.rank}</span>
                            <span class={r.ringClass} title="Match score out of 100">{r.scoreText}</span>
                            <div class="who">
                                <a href={r.url} target="_blank" class="name">{r.candidateName}</a>
                                <div class="qb-muted ellipsis">{r.meta}</div>
                                <div class="track"><div class={r.barClass} style={r.barStyle}></div></div>
                            </div>
                            <div class="tags">
                                <span class={r.sourceClass}>{r.sourceText}</span>
                                <template lwc:if={r.isWaiting}><span class="qb-pill qb-pill-review">AI pending</span></template>
                                <template lwc:if={r.isError}><span class="qb-pill qb-pill-error" title={r.error}>AI failed</span></template>
                                <template lwc:if={r.recordType}><span class="qb-pill">{r.recordType}</span></template>
                            </div>
                            <div class="actions">
                                <button class="qb-link" data-id={r.id} onclick={handleToggle}>{r.toggleText}</button>
                                <lightning-button label="Schedule interview" variant="brand-outline" data-id={r.candidateId}
                                    data-name={r.candidateName} onclick={handleScheduleClick}></lightning-button>
                            </div>
                        </div>
                        <template lwc:if={r.expanded}>
                            <div class="detail">
                                <p class="explanation">{r.explanation}</p>
                                <template lwc:if={r.hasMatched}>
                                    <div class="chips">
                                        <span class="qb-muted label">Has</span>
                                        <template for:each={r.matchedList} for:item="s">
                                            <span key={s} class="qb-chip">{s}</span>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:if={r.hasMissing}>
                                    <div class="chips">
                                        <span class="qb-muted label">Missing</span>
                                        <template for:each={r.missingList} for:item="s">
                                            <span key={s} class="qb-chip qb-chip-alt">{s}</span>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:if={r.isError}><p class="qb-muted">{r.error}</p></template>
                            </div>
                        </template>
                    </li>
                </template>
            </ul>
            <template lwc:if={showPager}>
                <div class="qb-pager">
                    <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePrev} disabled={prevDisabled}></lightning-button>
                    <span class="qb-muted">{pageText}</span>
                    <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={handleNext} disabled={nextDisabled}></lightning-button>
                </div>
            </template>
        </template>
    </div>

    <template lwc:if={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Schedule interview" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">Schedule interview · {selectedCandidateName}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-edit-form object-api-name="Interview__c" onsuccess={handleSuccess} onerror={handleError}>
                        <lightning-messages></lightning-messages>
                        <lightning-input-field field-name="Candidate_Name__c" value={selectedCandidateId}></lightning-input-field>
                        <lightning-input-field field-name="Opportunity__c" value={recordId}></lightning-input-field>
                        <lightning-input-field field-name="Job_Description__c" value={jobDescription}></lightning-input-field>
                        <lightning-input-field field-name="Interviewer_Name__c"></lightning-input-field>
                        <lightning-input-field field-name="Scheduled_Date_Time__c" required></lightning-input-field>
                        <div class="slds-m-top_medium slds-text-align_right">
                            <lightning-button variant="neutral" label="Cancel" onclick={handleCloseModal}></lightning-button>
                            <lightning-button label="Save" variant="brand" onclick={handleSave} class="slds-m-left_small"></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
