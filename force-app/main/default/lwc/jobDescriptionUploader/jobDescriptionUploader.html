<template>
    <!-- Spinner -->
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
    </template>

    <!-- Upload -->
    <lightning-card title="Upload Job Description" icon-name="custom:custom53">
        <div class="slds-m-around_medium">
            <lightning-input type="file"
                             accept=".csv,.jpg,.png,.pdf"
                             label="Upload Job Description File"
                             onchange={openfileUpload}
                             multiple>
            </lightning-input>
        </div>

        <!-- Uploaded files -->
        <template if:true={fileDataList}>
            <div class="slds-m-around_medium">
                <template for:each={fileDataList} for:item="file">
                    <p key={file.filename}>{file.filename}</p>
                </template>
            </div>
        </template>

        <div class="slds-m-around_medium">
            <lightning-button variant="brand"
                              label="Submit"
                              title="Submit"
                              onclick={handleClick}>
            </lightning-button>
        </div>
    </lightning-card>

    <!-- Show Newly Created JD -->
    <template if:true={showJobDescriptions}>
    <lightning-card title="Created Job Descriptions">
        <lightning-layout multiple-rows="true" class="slds-p-around_small">
            <template for:each={jobDescriptions} for:item="jd">
                <lightning-layout-item key={jd.id} size="12" medium-device-size="6" large-device-size="4">
                    <lightning-tile label={jd.name} href={jd.link} type="media">
                        <lightning-icon slot="media" icon-name="custom:custom14" alternative-text="Job Description" size="small"></lightning-icon>
                        
                        <p class="slds-truncate">Role: {jd.role}</p>
                        <p class="slds-truncate">Location: {jd.location}</p>
                    </lightning-tile>
                </lightning-layout-item>
            </template>
        </lightning-layout>
    </lightning-card>
</template>

</template>
