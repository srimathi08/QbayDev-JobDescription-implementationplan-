<template>
    <lightning-card title="Submit Interview Questions" icon-name="utility:event">
        <div class="slds-p-around_medium">
            
            <!-- Candidate Lookup -->
            <lightning-record-edit-form object-api-name="Interview_Question__c">
                <lightning-input-field 
                    field-name="Candidate_Name__c"
                    value={candidateId}
                    onchange={handleCandidateChange}>
                </lightning-input-field>
            </lightning-record-edit-form>

            <!-- Opportunity Lookup -->
            <lightning-record-edit-form object-api-name="Interview_Question__c">
                <lightning-input-field 
                    field-name="Opportunity_Name__c"
                    value={opportunityId}
                    onchange={handleOpportunityChange}>
                </lightning-input-field>
            </lightning-record-edit-form>

            <!-- Interview Date -->
            <lightning-input 
                type="date" 
                label="Interview Date" 
                value={interviewDate} 
                onchange={handleDateChange}>
            </lightning-input>

            <!-- Questions Section -->
            <div class="slds-m-top_medium slds-border_bottom slds-p-bottom_x-small">
                <strong>Interview Questions</strong>
            </div>

            <template for:each={questions} for:item="question" for:index="index">
                <div key={question.id} class="slds-grid slds-gutters slds-m-top_small">
                    <div class="slds-col slds-size_10-of-12">
                        <lightning-input 
                            label={question.label}
                            value={question.value}
                            data-index={index}
                            onchange={handleQuestionChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_2-of-12 slds-align_absolute-center">
                        <lightning-button-icon
                            icon-name="utility:delete"
                            alternative-text="Delete"
                            title="Delete"
                            onclick={removeQuestion}
                            data-index={index}
                            variant="bare"
                            class="delete-icon">
                        </lightning-button-icon>
                    </div>
                </div>
            </template>

            <!-- Action Buttons -->
            <div class="slds-m-top_medium">
                <lightning-button-icon
                    icon-name="utility:add"
                    alternative-text="Add Question"
                    title="Add Question"
                    onclick={addQuestion}
                    class="slds-m-right_small"
                    variant="brand">
                </lightning-button-icon>
                <lightning-button 
                    variant="brand" 
                    label="Save" 
                    onclick={saveQuestions}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
