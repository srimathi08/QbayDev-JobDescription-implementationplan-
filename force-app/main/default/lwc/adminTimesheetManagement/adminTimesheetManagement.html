<template>
    <div class="timesheet-container">
        <!-- Header Section - Separate Box -->
        <div class="header-box">
            <div class="header-content">
                <div class="header-left">
                    <lightning-icon icon-name="utility:clock" size="large" class="header-icon"></lightning-icon>
                    <div class="header-text">
                        <h1 class="header-title">Admin Timesheet Management</h1>
                        <p class="header-subtitle">Review and manage employee timesheet submissions</p>
                    </div>
                </div>
                <lightning-button 
                    label="Export CSV" 
                    icon-name="utility:download" 
                    onclick={handleExportCSV}
                    variant="brand"
                    class="export-btn">
                </lightning-button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stats-grid">
                <!-- 1st Card: Total Target Hours -->
                <div class="stat-card stat-card-blue-light">
                    <lightning-icon icon-name="utility:target" size="small" class="stat-icon"></lightning-icon>
                    <div class="stat-content">
                        <div class="stat-label">Total Target Hours</div>
                        <div class="stat-value">{stats.targetHours}</div>
                    </div>
                </div>
                <!-- 2nd Card: Total Entry Hours -->
                <div class="stat-card stat-card-blue">
                    <lightning-icon icon-name="utility:clock" size="small" class="stat-icon"></lightning-icon>
                    <div class="stat-content">
                        <div class="stat-label">Total Entry Hours</div>
                        <div class="stat-value">{stats.totalHours}</div>
                    </div>
                </div>
                <div class="stat-card stat-card-orange">
                    <lightning-icon icon-name="utility:warning" size="small" class="stat-icon"></lightning-icon>
                    <div class="stat-content">
                        <div class="stat-label">Pending Approvals</div>
                        <div class="stat-value">{stats.pendingApprovals} / {stats.pendingHours} hrs</div>
                    </div>
                </div>
                <div class="stat-card stat-card-green">
                    <lightning-icon icon-name="utility:check" size="small" class="stat-icon"></lightning-icon>
                    <div class="stat-content">
                        <div class="stat-label">Approved Hours</div>
                        <div class="stat-value">{stats.approvedHours}</div>
                    </div>
                </div>
                <div class="stat-card stat-card-red">
                    <lightning-icon icon-name="utility:close" size="small" class="stat-icon"></lightning-icon>
                    <div class="stat-content">
                        <div class="stat-label">Rejected Entries</div>
                        <div class="stat-value">{stats.rejectedEntries} / {stats.rejectedHours} hrs</div>
                    </div>
                </div>
                <div class="stat-card stat-card-purple">
                    <lightning-icon icon-name="utility:groups" size="small" class="stat-icon"></lightning-icon>
                    <div class="stat-content">
                        <div class="stat-label">Total Employees</div>
                        <div class="stat-value">{stats.totalEmployees}</div>
                    </div>
                </div>
                <!-- Leave Card -->
                <div class="stat-card stat-card-indigo">
                    <lightning-icon icon-name="utility:leave" size="small" class="stat-icon"></lightning-icon>
                    <div class="stat-content">
                        <div class="stat-label">Total Leave Time</div>
                        <div class="stat-value">{stats.totalLeaveHours}h / {stats.totalLeaveDays} Days</div>
                    </div>
                </div>
                <!-- Productivity Card -->
                <div class="stat-card stat-card-teal">
                    <lightning-icon icon-name="utility:metrics" size="small" class="stat-icon"></lightning-icon>
                    <div class="stat-content">
                        <div class="stat-label">Avg Productivity</div>
                        <div class="stat-value">{stats.avgProductivity}%</div>
                    </div>
                </div>
            </div>
        </div>

         <!-- Filters Section - Separate Box -->
        <div class="filters-box">
            <div class="filter-header">
                <lightning-icon icon-name="utility:filter" size="small" class="filter-icon"></lightning-icon>
                <h2 class="filter-title">Filters & Search</h2>
            </div>

            <div class="filter-content">
                <!-- All Filters in One Row -->
                <div class="filter-row filter-row-main">
                    <!-- Date Range Filter -->
                    <div class="filter-group">
                        <label class="filter-label">
                            <lightning-icon icon-name="utility:date" size="x-small"></lightning-icon>
                            Date Range
                        </label>
                        <div class="date-range-selector">
                            <lightning-button-icon 
                                icon-name="utility:chevronleft" 
                                alternative-text="Previous" 
                                onclick={handlePreviousMonth}
                                class="nav-btn">
                            </lightning-button-icon>
                            <div class="date-display">
                                <div class="date-range-text">{dateRangeLabel}</div>
                                <lightning-button 
                                    label={viewModeLabel} 
                                    onclick={handleMonthViewToggle}
                                    variant="base"
                                    size="small"
                                    class="view-toggle-btn">
                                </lightning-button>
                            </div>
                            <lightning-button-icon 
                                icon-name="utility:chevronright" 
                                alternative-text="Next" 
                                onclick={handleNextMonth}
                                class="nav-btn">
                            </lightning-button-icon>
                        </div>
                    </div>

                    <!-- Employee Filter -->
                    <!--<div class="filter-group">
                        <label class="filter-label">
                            <lightning-icon icon-name="utility:people" size="x-small"></lightning-icon>
                            Employee
                        </label>
                        <lightning-combobox
                            name="employee"
                            value={selectedEmployee}
                            placeholder="Search employee..."
                            options={employeeOptions}
                            onchange={handleEmployeeChange}
                            class="filter-input">
                        </lightning-combobox>
                    </div>-->
                    <!-- Employee Filter -->
<div class="filter-group">
    <div class="filter-dropdown-popover">
    <label class="filter-label">
        <lightning-icon icon-name="utility:people" size="x-small"></lightning-icon>
        Employee
    </label>
    <lightning-input type="search" 
        placeholder="Search employee..." 
        onchange={handleEmployeeSearchChange}
        value={employeeSearch}
        class="filter-input">
    </lightning-input>
    <template if:true={showEmployeeDropdown}>
        <div class="custom-dropdown-listbox">
            <template for:each={filteredEmployeeResults} for:item="emp">
                <div key={emp.value} 
                     class="dropdown-item" 
                     data-value={emp.value}
                     onclick={handleEmployeeSelect}>
                     {emp.label}
                </div>
            </template>
        </div>
    </template>
</div>
</div>
<!-- Department Filter -->
<div class="filter-group">
<div class="filter-dropdown-popover">
    <label class="filter-label">
        <lightning-icon icon-name="utility:organization" size="x-small"></lightning-icon>
        Department
    </label>
    <lightning-input type="search" 
        placeholder="Search department..." 
        onchange={handleDepartmentSearchChange}
        value={departmentSearch}
        class="filter-input">
    </lightning-input>
    <template if:true={showDepartmentDropdown}>
        <div class="custom-dropdown-listbox">
            <template for:each={filteredDepartmentResults} for:item="dep">
                <div key={dep.value} 
                     class="dropdown-item" 
                     data-value={dep.value}
                     onclick={handleDepartmentSelect}>
                     {dep.label}
                </div>
            </template>
        </div>
    </template>
</div>
</div>
<!-- Project Filter -->
<div class="filter-group">
   <div class="filter-dropdown-popover">
    <label class="filter-label">
        <lightning-icon icon-name="utility:project" size="x-small"></lightning-icon>
        Project
    </label>
    <lightning-input type="search" 
        placeholder="Search project..." 
        onchange={handleProjectSearchChange}
        value={projectSearch}
        class="filter-input">
    </lightning-input>
    <template if:true={showProjectDropdown}>
        <div class="custom-dropdown-listbox">
            <template for:each={filteredProjectResults} for:item="proj">
                <div key={proj.value} 
                     class="dropdown-item" 
                     data-value={proj.value}
                     onclick={handleProjectSelect}>
                     {proj.label}
                </div>
            </template>
        </div>
    </template>
</div>
</div>

                    <!-- Department Filter -->
                    <!--<div class="filter-group">
                        <label class="filter-label">
                            <lightning-icon icon-name="utility:organization" size="x-small"></lightning-icon>
                            Department
                        </label>
                        <lightning-combobox
                            name="department"
                            value={selectedDepartment}
                            placeholder="Search department..."
                            options={departmentOptions}
                            onchange={handleDepartmentChange}
                            class="filter-input">
                        </lightning-combobox>
                    </div>

                    !-- Project Filter --
                    <div class="filter-group">
                        <label class="filter-label">
                            <lightning-icon icon-name="utility:project" size="x-small"></lightning-icon>
                            Project
                        </label>
                        <lightning-combobox
                            name="project"
                            value={selectedProject}
                            placeholder="Search project..."
                            options={projectOptions}
                            onchange={handleProjectChange}
                            class="filter-input">
                        </lightning-combobox>
                    </div>-->

                    <!-- Status Filter -->
                    <div class="filter-group">
                        <label class="filter-label">
                            <lightning-icon icon-name="utility:status" size="x-small"></lightning-icon>
                            Status
                        </label>
                        <lightning-combobox
                            name="status"
                            value={selectedStatus}
                            placeholder="Select status..."
                            options={statusOptions}
                            onchange={handleStatusChange}
                            class="filter-input">
                        </lightning-combobox>
                    </div>
                </div>

                <!-- Active Filters Pills -->
                <div class="active-filters" data-active={hasActiveFilters}>
                    <div class="pills-label">Active Filters:</div>
                    <div class="filter-pills">
                        <template if:true={selectedEmployee}>
                            <lightning-pill 
                                label={selectedEmployee}
                                onremove={handleClearEmployee}
                                class="filter-pill">
                            </lightning-pill>
                        </template>
                        <template if:true={selectedDepartment}>
                            <lightning-pill 
                                label={selectedDepartment}
                                onremove={handleClearDepartment}
                                class="filter-pill">
                            </lightning-pill>
                        </template>
                        <template if:true={selectedProject}>
                            <lightning-pill 
                                label={selectedProject}
                                onremove={handleClearProject}
                                class="filter-pill">
                            </lightning-pill>
                        </template>
                        <template if:true={selectedStatus}>
                            <lightning-pill 
                                label={selectedStatus}
                                onremove={handleClearStatus}
                                class="filter-pill">
                            </lightning-pill>
                        </template>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="filter-actions">
                    <lightning-button 
                        label="Clear All Filters" 
                        icon-name="utility:close"
                        onclick={handleClearFilters}
                        variant="base"
                        class="clear-btn">
                    </lightning-button>
                </div>
            </div>
        </div>
        <!-- Results Info -->
        <div class="results-info">
            <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
            <span>{filteredEntries.length} timesheet entries found</span>
            <span>{paginationLabel}</span>
        </div>


        <!-- All Employee Timesheet Productivity (Lead Dashboard style) -->
        <div class="table-box ts-sum-card">
            <div class="sum-card-hdr ts-hdr">
                <div class="sum-card-hdr-l">
                    <span class="sum-card-ico">⏱</span>
                    <div>
                        <div class="sum-card-title">All Employee Timesheet Productivity</div>
                        <div class="sum-card-sub">Logged = Billable + Non-Billable + Shadow · Productivity = Approved / Target × 100</div>
                    </div>
                </div>
                <div class="sv-toggle ts-toggle">
                    <button class={tsBtnToday}   data-view="today"   onclick={handleSummaryViewChange}>Today</button>
                    <button class={tsBtnWeekly}  data-view="weekly"  onclick={handleSummaryViewChange}>Week</button>
                    <button class={tsBtnMonthly} data-view="monthly" onclick={handleSummaryViewChange}>Month</button>
                </div>
            </div>

            <div class="card-tbl-scroll ts-tbl-scroll">
                <table class="sum-tbl ts-tbl ts-wide-tbl">
                    <thead>
                        <tr class="ts-group-hdr-row">
                            <th class="col-emp" rowspan="2">Employee</th>
                            <th class="col-grp-hdr th-blue"   colspan="4">Logged Hours</th>
                            <th class="col-grp-hdr th-green"  colspan="4">Approved Hours</th>
                            <th class="col-grp-hdr th-red"    colspan="4">Rejected Hours</th>
                            <th class="col-grp-hdr th-indigo" colspan="2">Target & Leaves</th>
                            <th class="col-grp-hdr th-purple" colspan="4">Productivity Rate (Approved/Target×100)</th>
                        </tr>
                        <tr class="ts-sub-hdr-row">
                            <th class="col-sub th-blue">Bill</th><th class="col-sub th-blue">Non-Bill</th><th class="col-sub th-blue">Shadow</th><th class="col-sub th-blue-dark">Total</th>
                            <th class="col-sub th-green">Bill</th><th class="col-sub th-green">Non-Bill</th><th class="col-sub th-green">Shadow</th><th class="col-sub th-green-dark">Total</th>
                            <th class="col-sub th-red">Bill</th><th class="col-sub th-red">Non-Bill</th><th class="col-sub th-red">Shadow</th><th class="col-sub th-red-dark">Total</th>
                            <th class="col-sub th-indigo">Target</th><th class="col-sub th-indigo">Leaves</th>
                            <th class="col-sub th-purple">Bill</th><th class="col-sub th-purple">Non-Bill</th><th class="col-sub th-purple">Shadow</th><th class="col-sub th-purple-dark">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={paginatedSummaryRows} for:item="ts">
                            <tr key={ts.userId} class="ts-row clickable-row" data-name={ts.name} onclick={handleEmployeeClick}>
                                <td class="col-emp">
                                    <div class="emp-cell">
                                        <div class="emp-ava-xs ts-ava">{ts.initials}</div>
                                        <div class="emp-cell-info">
                                            <div class="sum-emp-name">{ts.name}</div>
                                            <div class="sum-emp-id">{ts.employeeId}</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="col-sub num-blue">{ts.loggedBillableDisplay}</td>
                                <td class="col-sub num-blue">{ts.loggedNonBillableDisplay}</td>
                                <td class="col-sub num-blue">{ts.loggedShadowDisplay}</td>
                                <td class="col-sub fw6 num-blue-dark">{ts.loggedTotalDisplay}</td>
                                <td class="col-sub num-green">{ts.approvedBillableDisplay}</td>
                                <td class="col-sub num-green">{ts.approvedNonBillableDisplay}</td>
                                <td class="col-sub num-green">{ts.approvedShadowDisplay}</td>
                                <td class="col-sub fw6 num-green-dark">{ts.approvedTotalDisplay}</td>
                                <td class="col-sub num-red">{ts.rejectedBillableDisplay}</td>
                                <td class="col-sub num-red">{ts.rejectedNonBillableDisplay}</td>
                                <td class="col-sub num-red">{ts.rejectedShadowDisplay}</td>
                                <td class="col-sub fw6 num-red-dark">{ts.rejectedTotalDisplay}</td>
                                <td class="col-sub num-blue" style="background: #f0f7ff;"><strong>{ts.targetDisplay}</strong></td>
                                <td class="col-sub num-red" style="background: #fffafa;">{ts.leaveDisplay} <br/><small>{ts.leaveDaysDisplay}</small></td>
                                <td class="col-sub"><span class="prod-chip">{ts.prodBillableDisplay}</span></td>
                                <td class="col-sub"><span class="prod-chip">{ts.prodNonBillableDisplay}</span></td>
                                <td class="col-sub"><span class="prod-chip">{ts.prodShadowDisplay}</span></td>
                                <td class="col-sub"><span class={ts.prodTotalClass}>{ts.prodTotalDisplay}</span></td>
                            </tr>
                        </template>
                    </tbody>
                    <tfoot>
                        <tr class="tfoot-total ts-total">
                            <td class="col-emp"><strong>Total / Avg</strong></td>
                            <td class="col-sub num-blue"><strong>{tsTotalLogBill}</strong></td>
                            <td class="col-sub num-blue"><strong>{tsTotalLogNonBill}</strong></td>
                            <td class="col-sub num-blue"><strong>{tsTotalLogShadow}</strong></td>
                            <td class="col-sub fw6 num-blue-dark"><strong>{tsTotalLogged}</strong></td>
                            <td class="col-sub num-green"><strong>{tsTotalAppBill}</strong></td>
                            <td class="col-sub num-green"><strong>{tsTotalAppNonBill}</strong></td>
                            <td class="col-sub num-green"><strong>{tsTotalAppShadow}</strong></td>
                            <td class="col-sub fw6 num-green-dark"><strong>{tsTotalApproved}</strong></td>
                            <td class="col-sub num-red"><strong>{tsTotalRejBill}</strong></td>
                            <td class="col-sub num-red"><strong>{tsTotalRejNonBill}</strong></td>
                            <td class="col-sub num-red"><strong>{tsTotalRejShadow}</strong></td>
                            <td class="col-sub fw6 num-red-dark"><strong>{tsTotalRejected}</strong></td>
                            <td class="col-sub num-blue"><strong>{tsTotalTarget}</strong></td>
                            <td class="col-sub num-red"><strong>{tsTotalLeave}</strong></td>
                            <td colspan="3" class="col-sub"></td>
                            <td class="col-sub"><span class="sum-rate avg-pill ts-avg-pill">{tsAvgProd}</span></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- Summary Pagination Controls -->
            <template if:true={hasTsSummaryRows}>
                <div class="pagination-container">
                    <div class="pagination-info">
                        <span class="page-size-label">Entries per page:</span>
                        <lightning-combobox
                            name="pageSize"
                            value={pageSize}
                            options={pageSizeOptions}
                            onchange={handlePageSizeChange}
                            variant="label-hidden"
                            class="page-size-select"
                            dropdown-alignment="auto"
                        ></lightning-combobox>
                    </div>
                    
                    <div class="pagination-controls">
                        <lightning-button-icon icon-name="utility:jump_to_left" variant="border-filled" disabled={sumDisablePrev} onclick={handleSumFirst} class="pagination-btn"></lightning-button-icon>
                        <lightning-button-icon icon-name="utility:chevronleft" variant="border-filled" disabled={sumDisablePrev} onclick={handleSumPrev} class="pagination-btn"></lightning-button-icon>
                        <div class="page-numbers">
                            <template for:each={sumPageNumbers} for:item="page">
                                <lightning-button
                                    key={page.number}
                                    label={page.number}
                                    variant={page.variant}
                                    data-page={page.number}
                                    onclick={handleSumPage}
                                    class="page-btn"
                                ></lightning-button>
                            </template>
                        </div>
                        <lightning-button-icon icon-name="utility:chevronright" variant="border-filled" disabled={sumDisableNext} onclick={handleSumNext} class="pagination-btn"></lightning-button-icon>
                        <lightning-button-icon icon-name="utility:jump_to_right" variant="border-filled" disabled={sumDisableNext} onclick={handleSumLast} class="pagination-btn"></lightning-button-icon>
                    </div>

                    <div class="pagination-status">
                        <span class="page-counter">Page {sumCurrentPage} of {sumTotalPages}</span>
                    </div>
                </div>
            </template>
        </div>


        <!-- Drill Down Panel -->
        <template if:true={showDrillDown}>
            <div class="drill-panel">
                <div class="drill-header">
                    <div class="drill-title">
                        <h2>{selectedDrillEmployee} - Timesheet Details</h2>
                    </div>
                    <lightning-button-icon icon-name="utility:close" variant="bare" onclick={closeDrillDown} alternative-text="Close" class="drill-close" size="large"></lightning-button-icon>
                </div>

                <!-- Project Breakdown Summary -->
                <div class="drill-section">
                    <div class="drill-section-header">
                        <lightning-icon icon-name="standard:project" size="small"></lightning-icon>
                        <h3 class="drill-subtitle">Project Productivity Breakdown</h3>
                    </div>
                    <div class="table-wrapper">
                        <table class="drill-tbl">
                            <thead>
                                <tr>
                                    <th>Project Name</th>
                                    <th>Billing Status</th>
                                    <th>Logged Hours</th>
                                    <th>Approved Hours</th>
                                    <th>Rejected Hours</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={drillProjectSummary} for:item="proj">
                                    <tr key={proj.id} class="drill-tr">
                                        <td class="fw6">{proj.projectName}</td>
                                        <td><span class={proj.billClass}>{proj.billingStatus}</span></td>
                                        <td class="num-blue fw6">{proj.loggedDisplay}</td>
                                        <td class="num-green fw6">{proj.approvedDisplay}</td>
                                        <td class="num-red fw6">{proj.rejectedDisplay}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Detailed Entries -->
                <div class="drill-section">
                    <div class="drill-section-header">
                        <lightning-icon icon-name="standard:timesheet" size="small"></lightning-icon>
                        <h3 class="drill-subtitle">Detailed Timesheet Entries</h3>
                    </div>
                    <div class="table-wrapper">
                        <table class="drill-tbl">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Project</th>
                                    <th>Task</th>
                                    <th>Hours</th>
                                    <th>Billing</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={paginatedDrillEntries} for:item="entry">
                                    <tr key={entry.id} class="drill-tr">
                                        <td><lightning-formatted-date-time value={entry.entryDate} time-zone="UTC"></lightning-formatted-date-time></td>
                                        <td class="fw6">{entry.projectName}</td>
                                        <td class="task-cell">{entry.task}</td>
                                        <td class="num-blue fw6">{entry.hours}h</td>
                                        <td>{entry.billingStatus}</td>
                                        <td>
                                            <lightning-badge label={entry.status} class={entry.statusClass}></lightning-badge>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <template if:false={drillEntries.length}>
                            <div class="empty-state">
                                <lightning-icon icon-name="utility:info" size="medium"></lightning-icon>
                                <p>No entries found for this employee.</p>
                            </div>
                        </template>
                    </div>

                    <template if:true={drillEntries.length}>
                        <!-- Drill-Down Pagination Controls -->
                        <div class="pagination-container" style="border-top: none;">
                            <div class="pagination-info">
                                <span class="page-size-label">Entries per page:</span>
                                <lightning-combobox
                                    name="pageSize"
                                    value={pageSize}
                                    options={pageSizeOptions}
                                    onchange={handlePageSizeChange}
                                    variant="label-hidden"
                                    class="page-size-select"
                                    dropdown-alignment="auto"
                                ></lightning-combobox>
                            </div>
                            
                            <div class="pagination-controls">
                                <lightning-button-icon icon-name="utility:jump_to_left" variant="border-filled" disabled={drillDisablePrev} onclick={handleDrillFirst} class="pagination-btn"></lightning-button-icon>
                                <lightning-button-icon icon-name="utility:chevronleft" variant="border-filled" disabled={drillDisablePrev} onclick={handleDrillPrev} class="pagination-btn"></lightning-button-icon>
                                <div class="page-numbers">
                                    <template for:each={drillPageNumbers} for:item="page">
                                        <lightning-button
                                            key={page.number}
                                            label={page.number}
                                            variant={page.variant}
                                            data-page={page.number}
                                            onclick={handleDrillPage}
                                            class="page-btn"
                                        ></lightning-button>
                                    </template>
                                </div>
                                <lightning-button-icon icon-name="utility:chevronright" variant="border-filled" disabled={drillDisableNext} onclick={handleDrillNext} class="pagination-btn"></lightning-button-icon>
                                <lightning-button-icon icon-name="utility:jump_to_right" variant="border-filled" disabled={drillDisableNext} onclick={handleDrillLast} class="pagination-btn"></lightning-button-icon>
                            </div>
        
                            <div class="pagination-status">
                                <span class="page-counter">Page {drillCurrentPage} of {drillTotalPages}</span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
   
</template>
