<template>
     <lightning-card variant="narrow">
        <div class="dashboard-menu">
            <div class="menu-item" onclick={handleFeed}>
                <lightning-icon icon-name="utility:feed" size="large" alternative-text="Feed"></lightning-icon>
                <span>Feed</span>
            </div>

            <div class="menu-item" onclick={handleDeals}>
                <lightning-icon icon-name="utility:groups" size="large" alternative-text="Deals"></lightning-icon>
                <span>Opportunities</span>
            </div>

            <div class="menu-item" onclick={handleMarketingEmail}>
                <lightning-icon icon-name="utility:email" size="large" alternative-text="Marketing Email"></lightning-icon>
                <span>Mktg. Email</span>
            </div>

         <div class="create-button" onclick={openCreateMenu}>
    + Create
  </div>

  <template if:true={showCreateMenu}>
  <section class="modal">
    <button class="close-button" onclick={closeCreateMenu} aria-label="Close modal">&times;</button>
    <div class="modal-options-row">
      <button onclick={createAccount}>Account</button>
      <button onclick={createContact}>Contact</button>
      <button onclick={createOpportunity}>Opportunity</button>
    </div>
  </section>
</template>

<!-- Account Modal -->
<template if:true={showAccountModal}>
  <section class="modal">
    <button class="close-button" onclick={closeCreateMenu}>&times;</button>
    <div class="modal-content">
 <lightning-combobox
          name="recordTypeSelect"
          label="Select Account Record Type"
          options={recordTypeOptions}
          value={selectedCreateRecordTypeId}
          onchange={handleRecordTypeChange}>
        </lightning-combobox>

      <lightning-record-edit-form object-api-name="Account" onsuccess={handleAccountSuccess}>
        <lightning-messages></lightning-messages>

        <lightning-input-field field-name="Name"></lightning-input-field>
        <lightning-input-field field-name="Type"></lightning-input-field>
        <lightning-input-field field-name="Industry"></lightning-input-field>
        <lightning-input-field field-name="IsCustomer__c"></lightning-input-field>

        <lightning-button type="submit" label="Create" variant="brand"></lightning-button>
      </lightning-record-edit-form>
    </div>
  </section>
</template>

<!-- Contact Modal -->
<template if:true={showContactModal}>
  <section class="modal">
    <button class="close-button" onclick={closeCreateMenu}>&times;</button>
    <div class="modal-content">
      <lightning-record-edit-form object-api-name="Contact" onsuccess={handleContactSuccess}>
        <lightning-messages></lightning-messages>

        <lightning-input-field field-name="FirstName"></lightning-input-field>
        <lightning-input-field field-name="LastName"></lightning-input-field>
        <lightning-input-field field-name="Email"></lightning-input-field>
        <lightning-input-field field-name="Phone"></lightning-input-field>
        <lightning-input-field field-name="AccountId"></lightning-input-field>

        <lightning-button type="submit" label="Create" variant="brand"></lightning-button>
      </lightning-record-edit-form>
    </div>
  </section>
</template>


 <!-- Opportunity Modal -->
<!-- Opportunity Modal -->
<template if:true={showOpportunityModal}>
  <section class="modal opportunity-modal">
    <div class="modal-content">
      <!-- Close button inside the card -->
      <button class="close-button" onclick={closeCreateMenu} aria-label="Close">&times;</button>

      <lightning-record-edit-form object-api-name="Opportunity" onsuccess={handleOpportunitySuccess}>
        <lightning-messages></lightning-messages>

        <lightning-input-field field-name="Name"></lightning-input-field>
        <lightning-input-field field-name="StageName"></lightning-input-field>
        <lightning-input-field field-name="CloseDate"></lightning-input-field>
        <lightning-input-field field-name="Type"></lightning-input-field>
        <lightning-input-field field-name="Amount"></lightning-input-field>

        <!-- Account Lookup + New Account Button -->
        <div class="slds-grid slds-wrap slds-m-bottom_medium inline-account-row">
          <div class="slds-col slds-size_10-of-12">
            <lightning-input-field
              field-name="AccountId"
              value={selectedAccountIdForOpportunity}
              onchange={handleAccountLookupChange}>
            </lightning-input-field>
          </div>
          <div class="slds-col slds-size_2-of-12 slds-p-left_x-small">
            <lightning-button label="+ New" onclick={openInlineAccountForOpportunity}></lightning-button>
          </div>
        </div>

        <lightning-button type="submit" label="Create" variant="brand"></lightning-button>
      </lightning-record-edit-form>
    </div>
  </section>
</template>


<!-- Inline Account Modal from Opportunity Modal -->
<!-- Inline Account Modal from Opportunity Modal -->
<template if:true={showInlineAccountModalForOpportunity}>
  <section class="modal account-modal">
    <div class="modal-content">
      <!-- Close button -->
      <button class="close-button" onclick={closeInlineAccountForOpportunity} aria-label="Close">&times;</button>

      <lightning-combobox
        name="recordTypeSelect"
        label="Select Account Record Type"
        options={recordTypeOptions}
        value={selectedCreateRecordTypeId}
        onchange={handleRecordTypeChange}>
      </lightning-combobox>

      <lightning-record-edit-form
        object-api-name="Account"
        onsuccess={handleInlineAccountCreatedForOpportunity}>

        <lightning-messages></lightning-messages>
        <lightning-input-field field-name="Name"></lightning-input-field>
        <lightning-input-field field-name="Type"></lightning-input-field>
        <lightning-input-field field-name="Industry"></lightning-input-field>

        <lightning-button type="submit" label="Create Account" variant="brand"></lightning-button>
      </lightning-record-edit-form>
    </div>
  </section>
</template>


 <!-- FEED / MY TASKS MODAL (added) -->
      <template if:true={showFeedModal}>
        <section class="modal tasks-modal" role="dialog" aria-modal="true" aria-label="My Tasks">
          <div class="modal-content modal-lg">
            <!-- Close button -->
            <button class="modal-close" onclick={closeFeed} aria-label="Close My Tasks">&times;</button>
            <!-- My Tasks Component -->
            <c-my-tasks></c-my-tasks>
          </div>
        </section>
      </template>
      <!-- /FEED / MY TASKS MODAL -->
    </div>
  </lightning-card>
</template>
