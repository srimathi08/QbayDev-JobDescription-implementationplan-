<template>
    <div class="qb-panel search">
        <div class="qb-head">
            <span class="qb-head-icon"><lightning-icon icon-name="utility:search" size="x-small"></lightning-icon></span>
            <div>
                <div class="qb-title">Magic Search</div>
                <div class="qb-sub">Describe the person you need in plain English. Then ask AI about the results.</div>
            </div>
            <template lwc:if={showClear}>
                <div class="qb-head-actions">
                    <lightning-button label="Clear" icon-name="utility:refresh" onclick={handleClear}></lightning-button>
                </div>
            </template>
        </div>

        <!-- 1. Search -->
        <div class="search-bar" onkeyup={handleKeyUp}>
            <lightning-input class="search-input" type="search" variant="label-hidden" label="Search" value={searchKey}
                placeholder="e.g. Salesforce developer in Chennai with 5+ years, LWC and integration"
                onchange={handleSearchChange}></lightning-input>
            <lightning-button variant="brand" label="Search" icon-name="utility:search" onclick={runSearch} disabled={searchDisabled}></lightning-button>
        </div>
        <div class="controls">
            <div class="qb-segment" aria-label="Search in">
                <template for:each={typeButtons} for:item="b">
                    <button key={b.value} class={b.cls} data-value={b.value} onclick={handleTypeClick}>{b.label}</button>
                </template>
            </div>
            <div class="examples">
                <span class="qb-muted">Try:</span>
                <template for:each={examples} for:item="ex">
                    <button key={ex.label} class="qb-chip example" data-label={ex.label} onclick={handleExample}>{ex.label}</button>
                </template>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative spinner-box"><lightning-spinner alternative-text="Searching" size="small"></lightning-spinner></div>
        </template>
        <template lwc:if={errorMessage}>
            <div class="qb-empty error">{errorMessage}</div>
        </template>
        <template lwc:if={noResults}>
            <div class="qb-empty">
                <div class="qb-title">No matches</div>
                <div>{understoodText} Try fewer or different words, a lower experience, or include employees and contractors.</div>
            </div>
        </template>

        <template lwc:if={hasResults}>
            <!-- 2. Ask AI about the results -->
            <div class="ask">
                <div class="ask-head">
                    <lightning-icon icon-name="utility:magicwand" size="x-small"></lightning-icon>
                    <span class="ask-title">Ask AI about these {countText}</span>
                </div>
                <div class="search-bar" onkeyup={handleAskKeyUp}>
                    <lightning-input class="search-input" variant="label-hidden" label="Question" value={question}
                        placeholder="e.g. Who is the best fit for a senior LWC role? (leave empty for a summary)"
                        onchange={handleQuestion}></lightning-input>
                    <lightning-button variant="brand" label="Ask AI" onclick={handleAsk} disabled={askDisabled}></lightning-button>
                </div>
                <div class="examples">
                    <template for:each={askExamples} for:item="ex">
                        <button key={ex.label} class="qb-chip qb-chip-alt example" data-label={ex.label} onclick={handleAskExample}>{ex.label}</button>
                    </template>
                </div>
                <template lwc:if={answerLoading}>
                    <div class="slds-is-relative spinner-box"><lightning-spinner alternative-text="Thinking" size="small"></lightning-spinner></div>
                </template>
                <template lwc:if={answer}>
                    <div class="answer"><lightning-formatted-rich-text value={answer}></lightning-formatted-rich-text></div>
                </template>
            </div>

            <!-- 3. Results -->
            <div class="results-head">
                <span class="qb-title">{countText}</span>
                <span class="qb-muted">{understoodText}</span>
            </div>
            <div class="grid">
                <template for:each={pageRows} for:item="r">
                    <article key={r.id} class="card">
                        <div class="card-top">
                            <span class="avatar">{r.initials}</span>
                            <div class="who">
                                <a href={r.url} target="_blank" class="name">{r.name}</a>
                                <div class="qb-muted">{r.meta}</div>
                            </div>
                            <span class="qb-pill">{r.experienceText}</span>
                        </div>
                        <div class="card-tags">
                            <span class="qb-pill qb-pill-review">{r.recordType}</span>
                            <template lwc:if={r.matchText}>
                                <span class={r.matchClass} title={r.matchWords}>{r.matchText}</span>
                            </template>
                            <template lwc:if={r.resumeUrl}>
                                <a href={r.resumeUrl} target="_blank" class="resume" title={r.resumeTitle}>Resume</a>
                            </template>
                        </div>
                        <template lwc:if={r.hasSkills}>
                            <div class="chips">
                                <template for:each={r.skills} for:item="s">
                                    <span key={s} class="qb-chip">{s}</span>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={r.hasCerts}>
                            <div class="chips">
                                <template for:each={r.certifications} for:item="c">
                                    <span key={c} class="qb-chip qb-chip-alt">{c}</span>
                                </template>
                            </div>
                        </template>
                    </article>
                </template>
            </div>
            <template lwc:if={showPager}>
                <div class="qb-pager">
                    <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePrev} disabled={prevDisabled}></lightning-button>
                    <span class="qb-muted">{pageText}</span>
                    <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={handleNext} disabled={nextDisabled}></lightning-button>
                </div>
            </template>
        </template>
        <p class="qb-muted footnote">Searches names, designation, location, company, skills, certifications and projects. Only records you can see are shown.</p>
    </div>
</template>
