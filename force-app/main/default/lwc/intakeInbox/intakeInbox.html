<template>
    <lightning-card title="Intake inbox" icon-name="standard:record_lookup">
        <lightning-button-icon slot="actions" icon-name="utility:refresh" alternative-text="Refresh" title="Refresh" onclick={refresh}></lightning-button-icon>
        <div class="slds-m-horizontal_medium">
            <div class="slds-grid slds-gutters_x-small slds-wrap slds-grid_vertical-align-end">
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
                    <lightning-combobox label="Show" value={status} options={statusOptions} onchange={handleStatus}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
                    <lightning-combobox label="Channel" value={channel} options={channelOptions} onchange={handleChannel}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
                    <lightning-combobox label="Period" value={days} options={dayOptions} onchange={handleDays}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5 slds-p-bottom_xx-small">
                    <lightning-input type="toggle" label="Only mine" checked={mineOnly} message-toggle-active="" message-toggle-inactive="" onchange={handleMine}></lightning-input>
                </div>
            </div>

            <div class="slds-m-vertical_small counts">
                <template for:each={counts} for:item="c">
                    <span key={c.label} class={c.cls}>{c.label}: {c.count}</span>
                </template>
            </div>

            <template lwc:if={loading}>
                <div class="slds-is-relative slds-p-around_large"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
            </template>
            <template lwc:elseif={hasRows}>
                <template for:each={rows} for:item="r">
                    <c-intake-row key={r.serviceId} row={r} show-meta onrowchange={handleRowChange}></c-intake-row>
                </template>
                <template lwc:if={atLimit}>
                    <p class="slds-text-body_small slds-text-color_weak">Showing the latest 200. Narrow the filters to see older ones.</p>
                </template>
            </template>
            <template lwc:else>
                <p class="slds-p-vertical_medium slds-text-color_weak">Nothing here for these filters.</p>
            </template>
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Email and WhatsApp intakes are shown for reference; they are handled by their own process.</p>
        </div>
    </lightning-card>
</template>
