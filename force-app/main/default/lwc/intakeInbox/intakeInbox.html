<template>
    <div class="qb-panel inbox">
        <div class="qb-head">
            <span class="qb-head-icon"><lightning-icon icon-name="utility:inbox" size="x-small"></lightning-icon></span>
            <div>
                <div class="qb-title">Intake inbox</div>
                <div class="qb-sub">Every resume and JD received by upload, email and WhatsApp</div>
            </div>
            <div class="qb-head-actions">
                <lightning-button-icon icon-name="utility:refresh" variant="border-filled" alternative-text="Refresh" title="Refresh" onclick={refresh}></lightning-button-icon>
            </div>
        </div>

        <div class="filters">
            <lightning-combobox class="filter" label="Channel" value={channel} options={channelOptions} onchange={handleChannel}></lightning-combobox>
            <lightning-combobox class="filter" label="Period" value={days} options={dayOptions} onchange={handleDays}></lightning-combobox>
            <lightning-input class="mine" type="toggle" label="Only mine" checked={mineOnly} message-toggle-active="" message-toggle-inactive="" onchange={handleMine}></lightning-input>
        </div>

        <div class="layout">
            <!-- Left: status views with counts -->
            <nav class="nav" aria-label="Status">
                <template for:each={views} for:item="v">
                    <button key={v.name} class={v.cls} data-name={v.name} onclick={handleView}>
                        <span>{v.label}</span>
                        <span class="count">{v.count}</span>
                    </button>
                </template>
            </nav>

            <!-- Right: list, 5 per page -->
            <section class="list">
                <div class="list-head">
                    <span class="list-title">{viewLabel}</span>
                    <span class="qb-muted">{rangeText}</span>
                </div>
                <template lwc:if={loading}>
                    <div class="slds-is-relative spinner-box"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
                </template>
                <template lwc:elseif={hasRows}>
                    <template for:each={pageRows} for:item="r">
                        <c-intake-row key={r.serviceId} row={r} show-meta onrowchange={handleRowChange}></c-intake-row>
                    </template>
                    <template lwc:if={showPager}>
                        <div class="qb-pager">
                            <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePrev} disabled={prevDisabled}></lightning-button>
                            <span class="qb-muted">{pageText}</span>
                            <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={handleNext} disabled={nextDisabled}></lightning-button>
                        </div>
                    </template>
                    <template lwc:if={atLimit}>
                        <p class="qb-muted note">Showing the latest 200. Narrow the period to see older ones.</p>
                    </template>
                </template>
                <template lwc:else>
                    <div class="qb-empty">{emptyText}</div>
                </template>
                <p class="qb-muted note">Email and WhatsApp intakes are shown for reference; they are handled by their own process.</p>
            </section>
        </div>
    </div>
</template>
