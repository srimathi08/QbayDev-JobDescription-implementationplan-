<template>
    <lightning-card title="Intake inbox" icon-name="standard:record_lookup">
        <lightning-button-icon slot="actions" icon-name="utility:refresh" alternative-text="Refresh" title="Refresh" onclick={refresh}></lightning-button-icon>
        <div class="slds-grid slds-wrap inbox">
            <!-- Left: status views with counts -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 nav-col">
                <lightning-vertical-navigation selected-item={view} onselect={handleView} compact shaded>
                    <lightning-vertical-navigation-section label="Show">
                        <template for:each={views} for:item="v">
                            <lightning-vertical-navigation-item-badge key={v.name} label={v.label} name={v.name} badge-count={v.count}></lightning-vertical-navigation-item-badge>
                        </template>
                    </lightning-vertical-navigation-section>
                </lightning-vertical-navigation>
            </div>

            <!-- Right: filters, list, pages -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-4 list-col">
                <div class="slds-grid slds-gutters_x-small slds-wrap slds-grid_vertical-align-end">
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                        <lightning-combobox label="Channel" value={channel} options={channelOptions} onchange={handleChannel}></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                        <lightning-combobox label="Period" value={days} options={dayOptions} onchange={handleDays}></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-bottom_xx-small">
                        <lightning-input type="toggle" label="Only mine" checked={mineOnly} message-toggle-active="" message-toggle-inactive="" onchange={handleMine}></lightning-input>
                    </div>
                </div>

                <div class="slds-grid slds-grid_vertical-align-center slds-m-vertical_small list-head">
                    <h3 class="slds-text-heading_small">{viewLabel}</h3>
                    <span class="slds-m-left_small slds-text-body_small slds-text-color_weak">{rangeText}</span>
                </div>

                <template lwc:if={loading}>
                    <div class="slds-is-relative slds-p-around_large"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
                </template>
                <template lwc:elseif={hasRows}>
                    <template for:each={pageRows} for:item="r">
                        <c-intake-row key={r.serviceId} row={r} show-meta onrowchange={handleRowChange}></c-intake-row>
                    </template>
                    <template lwc:if={showPager}>
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_small pager">
                            <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePrev} disabled={prevDisabled}></lightning-button>
                            <span class="slds-text-body_small">{pageText}</span>
                            <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={handleNext} disabled={nextDisabled}></lightning-button>
                        </div>
                    </template>
                    <template lwc:if={atLimit}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">Showing the latest 200. Narrow the period to see older ones.</p>
                    </template>
                </template>
                <template lwc:else>
                    <p class="slds-p-vertical_medium slds-text-color_weak">{emptyText}</p>
                </template>
                <p class="slds-text-body_small slds-text-color_weak slds-m-vertical_small">Email and WhatsApp intakes are shown for reference; they are handled by their own process.</p>
            </div>
        </div>
    </lightning-card>
</template>
