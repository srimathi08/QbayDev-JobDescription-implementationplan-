<template>
    <div class={boxClass}>
        <div class="top">
            <span class="file-icon"><lightning-icon icon-name={fileIcon} size="small"></lightning-icon></span>
            <div class="file">
                <div class="file-name" title={row.fileName}>{row.fileName}</div>
                <template lwc:if={metaText}>
                    <div class="qb-muted">{metaText}</div>
                </template>
            </div>
            <span class={badgeClass}>
                <template lwc:if={isRunning}><span class="dot"></span></template>
                {statusLabel}
            </span>
        </div>

        <template lwc:if={row.message}>
            <p class="message">{row.message}</p>
        </template>

        <template lwc:if={hasLinks}>
            <div class="links">
                <template lwc:if={accountUrl}>
                    <a href={accountUrl} target="_blank" class="qb-chip">{accountLabel}</a>
                </template>
                <template lwc:if={opportunityUrl}>
                    <a href={opportunityUrl} target="_blank" class="qb-chip qb-chip-alt">Opportunity: {row.opportunityName}</a>
                </template>
                <template lwc:if={jobDescriptionUrl}>
                    <a href={jobDescriptionUrl} target="_blank" class="qb-chip qb-chip-alt">JD: {row.jobDescriptionName}</a>
                </template>
            </div>
        </template>

        <template lwc:if={hasActions}>
            <div class="actions">
                <template lwc:if={row.canReview}>
                    <lightning-button label={reviewLabel} icon-name="utility:edit" variant={reviewVariant} onclick={toggleForm} disabled={busy}></lightning-button>
                </template>
                <template lwc:if={row.canChooseJd}>
                    <lightning-button variant="brand" label="Use existing Opportunity" icon-name="utility:link" onclick={handleUseExistingOpp} disabled={busy}></lightning-button>
                    <lightning-button label="Create new Opportunity" icon-name="utility:add" onclick={handleCreateNewOpp} disabled={busy}></lightning-button>
                </template>
                <template lwc:if={row.canAttach}>
                    <lightning-button label="Attach resume to existing candidate" icon-name="utility:attach" onclick={handleAttach} disabled={busy}></lightning-button>
                </template>
                <template lwc:if={row.canRetry}>
                    <lightning-button label="Retry" icon-name="utility:refresh" onclick={handleRetry} disabled={busy}></lightning-button>
                </template>
            </div>
        </template>

        <!-- JD without a company: type the client name (27-11-2026) -->
        <template lwc:if={row.canGiveClient}>
            <div class="form">
                <div class="form-grid">
                    <lightning-input class="grow" label="Client (company) name" required value={clientName} max-length="255"
                        placeholder="e.g. Infosys Ltd" onchange={handleClientName}></lightning-input>
                    <lightning-button variant="brand" label="Continue" onclick={handleClientContinue} disabled={busy}></lightning-button>
                </div>
            </div>
        </template>

        <template lwc:if={showForm}>
            <div class="form">
                <p class="qb-muted">Enter at least one. The details already read from the file are reused, so no new AI call is made.</p>
                <div class="form-grid">
                    <lightning-input class="grow" type="email" label="Email" value={email} onchange={handleEmail}></lightning-input>
                    <lightning-input class="grow" type="tel" label="Phone" value={phone} onchange={handlePhone}></lightning-input>
                    <lightning-input class="grow" type="url" label="LinkedIn profile" value={linkedIn} onchange={handleLinkedIn}></lightning-input>
                </div>
                <div class="actions">
                    <lightning-button variant="brand" label="Continue" onclick={handleContinue} disabled={busy}></lightning-button>
                    <lightning-button label="Cancel" onclick={toggleForm} disabled={busy}></lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
