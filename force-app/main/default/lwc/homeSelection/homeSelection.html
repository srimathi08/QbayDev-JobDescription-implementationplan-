<template>
    <lightning-card title="Make a Choice">
        <lightning-tabset active-tab-value={activeTab}>
            <div class="slds-m-around_x-small">
                <lightning-tab label="Upload Resume or JD" value="1" onactive={handleActive}>
                    <c-intake-uploader
                        requested-type="Auto"
                        show-type-switch
                        card-title="Upload resumes and job descriptions"
                        icon-name="custom:custom14"
                        file-label="Upload files"
                        onuploaded={handleUploaded}>
                    </c-intake-uploader>
                    <div class="slds-m-top_small">
                        <c-intake-inbox></c-intake-inbox>
                    </div>
                </lightning-tab>

                <lightning-tab label="Magic Search" value="2" onactive={handleActive}>
                    <c-searchablity-using-ai></c-searchablity-using-ai>
                </lightning-tab>
            </div>
        </lightning-tabset>
    </lightning-card>
</template>
