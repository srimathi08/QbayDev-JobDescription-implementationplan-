<template>
    <div class="home">
        <div class="hero">
            <div>
                <div class="hero-title">Qbay Talent Hub</div>
                <div class="hero-sub">Upload resumes and job descriptions, track every intake, and find the right people.</div>
            </div>
        </div>
        <lightning-tabset active-tab-value={activeTab} variant="scoped">
            <lightning-tab label="Upload Resume or JD" value="1" icon-name="utility:upload" onactive={handleActive}>
                <div class="stack">
                    <c-intake-uploader
                        requested-type="Auto"
                        show-type-switch
                        card-title="Upload resumes and job descriptions"
                        icon-name="custom:custom14"
                        file-label="Upload files"
                        onuploaded={handleUploaded}>
                    </c-intake-uploader>
                    <c-intake-inbox></c-intake-inbox>
                </div>
            </lightning-tab>

            <lightning-tab label="Magic Search" value="2" icon-name="utility:search" onactive={handleActive}>
                <div class="stack">
                    <c-searchablity-using-ai></c-searchablity-using-ai>
                </div>
            </lightning-tab>
        </lightning-tabset>
    </div>
</template>
