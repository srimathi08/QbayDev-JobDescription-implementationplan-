<template>

    <!-- Spinner -->
    <template if:true={isLoading}>
        <lightning-spinner
            alternative-text="Processing..."
            size="medium">
        </lightning-spinner>
    </template>

    <!-- Upload Card -->
    <lightning-card title="Resume Submission" icon-name="custom:custom14">
        <div class="slds-m-around_medium">
            <lightning-input
                type="file"
                accept=".csv,.jpg,.png,.pdf"
                label="Attachment"
                multiple
                onchange={openfileUpload}>
            </lightning-input>
        </div>

        <!-- Uploaded File Names -->
        <template if:true={fileDataList}>
            <template for:each={fileDataList} for:item="file">
                <p key={file.filename}>{file.filename}</p>
            </template>
        </template>

        <!-- Buttons -->
        <div class="slds-m-around_medium">
            <lightning-button
                variant="brand"
                label="Submit"
                onclick={handleClick}>
            </lightning-button>

            <lightning-button
                variant="neutral"
                label="View Today Uploads"
                onclick={openTodayFilesModal}
                class="slds-m-left_small">
            </lightning-button>
        </div>
    </lightning-card>

    <!-- Created Accounts -->
    <template if:true={showAccountList}>
        <lightning-card title="Created Accounts">
            <lightning-layout multiple-rows class="slds-p-around_small">
                <template for:each={accounts} for:item="acc">
                    <lightning-layout-item key={acc.id} size="12" medium-device-size="6">
                        <lightning-tile label={acc.name} href={acc.link}>
                            <lightning-icon
                                slot="media"
                                icon-name="standard:account"
                                size="small">
                            </lightning-icon>
                            <p>Email: {acc.email}</p>
                        </lightning-tile>
                    </lightning-layout-item>
                </template>
            </lightning-layout>
        </lightning-card>
    </template>

    <!-- MODAL -->
    <template if:true={showModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        Today Uploaded Files
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-datatable
                        key-field="id"
                        data={todayFiles}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="neutral"
                        label="Close"
                        onclick={closeModal}>
                    </lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
