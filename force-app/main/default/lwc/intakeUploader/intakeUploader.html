<template>
    <div class="qb-panel uploader">
        <div class="qb-head">
            <span class="qb-head-icon"><lightning-icon icon-name="utility:upload" size="x-small"></lightning-icon></span>
            <div>
                <div class="qb-title">{cardTitle}</div>
                <div class="qb-sub">PDF or DOCX · up to {maxFileMb} MB each · up to {maxFiles} files at a time</div>
            </div>
            <template lwc:if={showTodayButton}>
                <div class="qb-head-actions">
                    <lightning-button label="View Today Uploads" onclick={openTodayModal}></lightning-button>
                </div>
            </template>
        </div>

        <!-- Vertical steps: 1 type, 2 files, 3 review (several files only), 4 results. Logic unchanged. -->
        <ol class="steps">
            <li class={stepTypeClass}>
                <span class="step-dot">1</span>
                <div class="step-body">
                    <div class="step-title">What are you uploading?</div>
                    <template lwc:if={showTypeSwitch}>
                        <div class="qb-segment" role="radiogroup" aria-label="Document type">
                            <template for:each={typeButtons} for:item="b">
                                <button key={b.value} class={b.cls} data-value={b.value} onclick={handleTypeClick} disabled={isBusy} role="radio">{b.label}</button>
                            </template>
                        </div>
                        <p class="qb-muted hint">{typeHint}</p>
                    </template>
                    <template lwc:else>
                        <span class="qb-pill qb-pill-review">{typeLabel}</span>
                    </template>
                </div>
            </li>

            <li class={stepFilesClass}>
                <span class="step-dot">2</span>
                <div class="step-body">
                    <div class="step-title">Add files</div>
                    <template lwc:if={ready}>
                        <div class="drop-zone">
                            <lightning-file-upload label={fileLabel} variant="label-hidden" name="intakeFiles" accept={acceptedFormats}
                                record-id={userId} multiple disabled={isBusy} onuploadfinished={handleUploadFinished}>
                            </lightning-file-upload>
                            <div class="qb-muted drop-help">One file is processed straight away. Several files wait in a review list until you click Start processing. The same file, even renamed, is never added twice for a candidate.</div>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="slds-is-relative spinner-box"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
                    </template>
                    <template lwc:if={isBusy}>
                        <p class="qb-muted busy">{busyText}</p>
                    </template>
                </div>
            </li>

            <template lwc:if={hasStaged}>
                <li class={stepReviewClass}>
                    <span class="step-dot">3</span>
                    <div class="step-body">
                        <div class="step-row">
                            <div class="step-title">Review and start ({stagedCount})</div>
                            <button class="qb-link" onclick={handleRemoveAll} disabled={isBusy}>Remove all</button>
                        </div>
                        <p class="qb-muted">Nothing is read yet. Remove any file you do not want.</p>
                        <template for:each={stagedView} for:item="f">
                            <div key={f.documentId} class="review-row">
                                <lightning-icon icon-name={f.icon} size="small" alternative-text={f.extLabel}></lightning-icon>
                                <div class="review-name">
                                    <div class="file-name" title={f.fileName}>{f.fileName}</div>
                                    <div class="qb-muted">{f.extLabel} · {f.sizeLabel}</div>
                                </div>
                                <span class={f.badgeClass} title={f.pendingMessage}>{f.checkLabel}</span>
                                <lightning-button-icon icon-name="utility:close" variant="bare" size="small"
                                    alternative-text="Remove this file" title="Remove this file" data-id={f.documentId}
                                    disabled={isBusy} onclick={handleRemoveFile}></lightning-button-icon>
                            </div>
                        </template>
                        <div class="start">
                            <lightning-button variant="brand" label={startLabel} disabled={startDisabled} onclick={handleStartProcessing}></lightning-button>
                        </div>
                    </div>
                </li>
            </template>

            <template lwc:if={showResultsStep}>
                <li class={stepResultsClass}>
                    <span class="step-dot">4</span>
                    <div class="step-body">
                        <div class="step-row">
                            <div class="step-title">Results</div>
                            <span class="qb-muted">{progressSummary}</span>
                            <div class="row-actions">
                                <template lwc:if={hasHidden}>
                                    <button class="qb-link" onclick={showHidden}>{hiddenLabel}</button>
                                </template>
                                <template lwc:if={hasResults}>
                                    <button class="qb-link" title="Hides the list only. Nothing is deleted." onclick={clearResults}>Hide all</button>
                                </template>
                            </div>
                        </div>
                        <template for:each={results} for:item="r">
                            <div key={r.serviceId} class="result-row">
                                <c-intake-row class="result-body" row={r} onrowchange={handleRowChange}></c-intake-row>
                                <lightning-button-icon icon-name="utility:hide" variant="bare" size="small" class="result-hide"
                                    alternative-text="Hide this result" title="Hide this result (nothing is deleted)"
                                    data-id={r.serviceId} onclick={handleHideResult}></lightning-button-icon>
                            </div>
                        </template>
                    </div>
                </li>
            </template>
        </ol>
    </div>

    <!-- Today's uploads (pages without the intake inbox) -->
    <template lwc:if={showModal}>
        <section role="dialog" aria-modal="true" aria-labelledby="today-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="today-title" class="slds-text-heading_medium">My uploads today</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template lwc:if={todayLoading}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>
                    <template lwc:elseif={hasToday}>
                        <template for:each={todayRows} for:item="t">
                            <c-intake-row key={t.serviceId} row={t} show-meta onrowchange={handleTodayChange}></c-intake-row>
                        </template>
                    </template>
                    <template lwc:else>
                        <p>No uploads today.</p>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
